<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#09090B"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#937dff"/>
      <stop offset="50%" stop-color="#cabeff"/>
      <stop offset="100%" stop-color="#a2e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#grad)" stroke-width="4" opacity="0.2" />
  <!-- Wave Bars -->
  <g filter="url(#glow)">
    <rect x="116" y="216" width="28" height="80" rx="14" fill="url(#grad)"/>
    <rect x="164" y="156" width="28" height="200" rx="14" fill="url(#grad)"/>
    <rect x="212" y="106" width="28" height="300" rx="14" fill="url(#grad)"/>
    <rect x="260" y="176" width="28" height="160" rx="14" fill="url(#grad)"/>
    <rect x="308" y="126" width="28" height="260" rx="14" fill="url(#grad)"/>
    <rect x="356" y="206" width="28" height="100" rx="14" fill="url(#grad)"/>
  </g>
</svg>
